
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8eee5">
  <title>Quiz Tajm Ditt resultat</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/script.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="index.html" class="brand">
        <img src="../assets/quiz-tajm-logo.png" alt="Quiz Tajm" class="brand-logo">
      </a>
      <button id="themeToggle" class="theme-button" aria-label="Byt tema">☾</button>
    </header>

    <main>
      <p class="eyebrow">QUIZET ÄR KLART!</p>
      <h1>Ditt resultat</h1>
      <p class="subtitle">Här är resultatet från ditt senaste försök.</p>

      <section class="card latest-card">
        <div class="section-heading">
          <h2>Ditt senaste resultat</h2>
          <span class="live-dot"></span>
        </div>

        <div id="latestResult">
          <div class="empty-state">Inget resultat har sparats ännu.</div>
        </div>
      </section>

      <section class="review-section">
        <div class="section-heading">
          <h2>Genomgång av svar</h2>
          <span id="answerCount" class="muted small"></span>
        </div>
        <div id="answerReview"></div>
      </section>

      <section class="history-section">
        <div class="section-heading">
          <h2>Tidigare försök</h2>
          <button id="toggleHistory" class="text-button">Visa alla resultat</button>
        </div>
        <p class="subtitle">Följ dina framsteg och jämför dina poäng.</p>
        <div id="historyList"></div>
      </section>

      <div class="actions">
        <button id="playAgain" class="primary-button">Spela igen</button>
        <button id="homeButton" class="secondary-button">Till startsidan</button>
      </div>
    </main>
  </div>
</body>
</html>
