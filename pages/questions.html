<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- GÖRS AV NATHALIE
    <header class="page-header">
        <img src="" alt="" class="logo-image">
        <div class="timer">
            <img src="" alt="" class="clock-image">
            <p class="time-value" id="time-value">00:00</p>
        </div>
    </header>
    <div class="cancel-container">
        <button class="cancel-btn">
            Avbryt
        </button>
    </div>
    <div class="questions-progress">
        <div class="labels">
            <p>Fråga <span id="progress-n">5</span> av <span id="progress-of"></span></p>
        </div>
        <div class="bar"></div>
    </div>
    -->
    <main>
        <form action="">
            <div class="question-container">
                <h1 class="question-category" id="question-category">Geography</h1>
                <h2 class="question-titel" id="question-titel">Vilket land tillhör exklaven Kaliningrad?</h2>
            </div>
            <div class="answers-container">
                <div class="answer" id="answer-1">
                    <div class="order-number-wrapper">
                        <h3 class="order-number">1</h3>
                    </div>
                    <h4 class="titel" id="answer-titel-1">Polen</h4>
                    <div class="check-wrapper">
                        <div class="check" id="check-1"></div>
                    </div>
                </div>
                <div class="answer" id="answer-2">
                    <div class="order-number-wrapper">
                        <h3 class="order-number">X</h3>
                    </div>
                    <h4 class="titel" id="answer-titel-2">Litauen</h4>
                    <div class="check-wrapper">
                        <div class="check" id="check-2"></div>
                    </div>
                </div>
                <div class="answer" id="answer-3">
                    <div class="order-number-wrapper">
                        <h3 class="order-number">3</h3>
                    </div>
                    <h4 class="titel" id="answer-titel-3">Ryssland</h4>
                    <div class="check-wrapper">
                        <div class="check" id="check-3"></div>
                    </div>
                </div>
            </div>
            <div class="submit-container">
                <!--<button class="submit-btn" type="submit" id="submit"><p>Bekräfta svar →</p></button>-->
                <button class="submit-btn" id="submit"><p>Bekräfta svar →</p></button> <!-- Dummy btn -->
                <p class="notice">
                    Du kan ändra ditt val innan du bekräftar
                </p>
            </div>
        </form>
    </main>
    <script src="../js/main.js"></script>
</body>
</html>
