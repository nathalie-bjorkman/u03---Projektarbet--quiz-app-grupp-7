<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Tajm Landningssida</title>
  </head>
  <body>
    <header></header>
    <main>
      <!-- Pill -->
      <div><p>Fyra minuter. Tio frågor.</p></div>
      <!-- Textarea -->
      <div>
        <h1>Hur mycket kan du egentligen?</h1>
        <p>
          Välj dina favoritämnen, utmnana dig själv och se hur långt din
          allmänbildning räcker!
        </p>
      </div>
      <!-- Välj tema -->
      <div>
        <h2>Välj tema</h2>
        <button>
          <h3>Blandat</h3>
          <p>Alla fyra ämnen</p>
        </button>
        <button>
          <h3>Natur & värld</h3>
          <p>Vetenskap och geografi</p>
        </button>
        <button>
          <h3>Sverige & Kultur</h3>
          <p>Svenskt och historiskt</p>
        </button>
      </div>
      <!-- Info-box -->
      <div>
        <div>
          <h4>Kvällens Quiz</h4>
          <p>Blandat</p>
        </div>
        <div><p>10 frågor • 4 minuter</p></div>
      </div>
    </main>
  </body>
</html>
